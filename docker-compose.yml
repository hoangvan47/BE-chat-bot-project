services:
  mongodb:
    image: mongo:7.0
    container_name: chat-bot-mongodb
    restart: always
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    networks:
      - chat-bot-network

volumes:
  mongodb_data:
    driver: local

networks:
  chat-bot-network:
    driver: bridge
